<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — IC Memo</title>
<!--
  ADCG Score + Risk Package — memo shell.
  Placeholders to replace:  {{TITLE}}  {{SUBTITLE}}  {{CLASSIF}}  {{EYEBROW}}
  {{SCORECARD}} (output of adcg_scorecard.py --out)   {{BODY}} (the memo prose)   {{FOOTER}}
  All visuals are static (CSS widths + inline SVG). No JavaScript -> faithful in headless PDF.
-->
<style>
  :root{
    --ink:#1a1c1a;--ink2:#3d423d;--paper:#f6f4ee;--card:#fffdf8;--line:#d9d4c7;
    --oxblood:#7a2230;--teal:#1f5a54;--gold:#b3892f;--neg:#9b2f2f;--muted:#8a877d;--bar-bg:#e7e2d5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;line-height:1.5;font-size:16px}
  .wrap{max-width:920px;margin:0 auto;padding:38px 30px 90px}
  header.top{border-bottom:3px double var(--ink);padding-bottom:18px;margin-bottom:26px}
  .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--oxblood);font-weight:700}
  h1{font-size:31px;line-height:1.12;margin:.28em 0 .18em;letter-spacing:-.01em}
  .sub{color:var(--ink2);font-size:15.5px;max-width:72ch}
  .classif{float:right;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
    color:var(--muted);text-transform:uppercase;border:1px solid var(--line);padding:4px 9px;border-radius:3px}
  h2{font-size:12px;font-family:ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;
    color:var(--oxblood);border-top:1px solid var(--line);padding-top:16px;margin:36px 0 12px}
  h3{font-size:18px;margin:24px 0 8px;letter-spacing:-.01em}
  p{margin:.5em 0}a{color:var(--teal)}small{color:var(--muted)}
  /* verdict cards */
  .verdict{display:grid;grid-template-columns:1.4fr 1fr 1.3fr;gap:14px;margin:22px 0 6px}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .vcard .k{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .vcard .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:3px}
  .vcard .slash{font-size:16px;color:var(--muted)}
  .vcard .rec{font-size:16px;font-weight:700;margin-top:8px;line-height:1.2}
  .tag{display:inline-block;margin-top:8px;font-size:11.5px;font-family:ui-monospace,monospace;
    padding:2px 8px;border-radius:20px;font-weight:700}
  .band-strong,.band-positive{background:#e0ebe9;color:#1f5a54;border:1px solid #bcd7d2}
  .band-neutral{background:#f2ead5;color:#7a5c14;border:1px solid #e0cf9f}
  .band-weak{background:#f2dede;color:#8a1f1f;border:1px solid #e3bcbc}
  .tag.risk{background:#f3e3d6;color:#8a4a1e;border:1px solid #e3c3a6}
  .tag.recc{background:#efe7d8;color:#5a4a26;border:1px solid #ddccae}
  .sc-meta,.sc-cal{margin:6px 0}
  /* fact strip */
  .facts{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:18px 0}
  .facts div{background:var(--card);padding:12px}
  .facts .k{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .facts .v{font-size:19px;font-weight:700;margin-top:2px}
  /* callouts */
  .tldr{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--oxblood);
    border-radius:0 8px 8px 0;padding:14px 20px;margin:12px 0}
  .tldr ul{margin:6px 0;padding-left:20px}.tldr li{margin:7px 0}
  ol.findings{padding-left:22px}ol.findings li{margin:11px 0}
  /* tables */
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:#efece3}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.hl td{background:#f4eede;font-weight:700}
  /* severity / conviction tags */
  .sev{font-family:ui-monospace,monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
  .s-high{background:#f2dede;color:#8a1f1f}.s-medhigh{background:#f3e4d4;color:#8a4a15}
  .s-med{background:#f2ead5;color:#7a5c14}.s-low{background:#e3ede0;color:#2f5f2a}
  .conv{font-family:ui-monospace,monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;
    white-space:nowrap;background:#e0ebe9;color:var(--teal)}
  /* pros / cons */
  .pc{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
  .pc .col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 16px 14px}
  .pc h4{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 4px}
  .pc .pros h4{color:var(--teal)}.pc .cons h4{color:var(--oxblood)}
  .pc ul{list-style:none;margin:0;padding:0}
  .pc li{padding:10px 0;border-bottom:1px dotted var(--line);font-size:14px}.pc li:last-child{border-bottom:0}
  .dim{display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  /* scorecard bars (from fragment) */
  .scorecard .sc-h{border-top:1px solid var(--line);padding-top:16px}
  .bars{margin:8px 0}
  .score-row{display:grid;grid-template-columns:190px 1fr 46px;align-items:center;gap:12px;margin:9px 0}
  .score-row .lbl{font-size:13px}.score-row .lbl small{display:block;color:var(--muted);font-size:10.5px}
  .track{height:14px;background:var(--bar-bg);border-radius:7px;overflow:hidden}
  .fill{height:100%;border-radius:7px}
  .score-row .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:14px}
  .score-row.overall{margin-top:14px;border-top:2px solid var(--ink);padding-top:12px}
  .gauge-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin:14px 0}
  .riskbig{font-size:44px;font-weight:700;line-height:1;margin:6px 0}
  .gauge-wrap .eyebrow{color:var(--oxblood)}
  .sc-note{background:#f0ece2;border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:13px;color:var(--ink2);margin-top:12px}
  /* gates / caveats */
  .gate{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 18px 12px;margin:10px 0}
  .gate .stage{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--oxblood);font-weight:700;margin-top:12px}
  .kill{color:var(--neg);font-weight:600}
  .caveat{background:#f0ece2;border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:13.5px;color:var(--ink2)}
  /* source tags */
  .src{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:3px;white-space:nowrap;vertical-align:1px}
  .src.hard{background:#e0ebe9;color:var(--teal)}.src.im{background:#e6e3f1;color:#3e3577}
  .src.mgmt{background:#f2ead5;color:#7a5c14}.src.est{background:#ece9e1;color:#6b675d;border:1px dashed #bdb7a8}
  /* callouts */
  .gap{background:#fbf1ec;border:1px solid #ebcdbf;border-left:4px solid var(--oxblood);border-radius:0 8px 8px 0;padding:10px 16px;margin:12px 0;font-size:14px}
  .gap b:first-child{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--oxblood);margin-right:6px}
  .explain{background:#eef3f2;border:1px solid #cfe0dc;border-radius:8px;padding:11px 16px;margin:12px 0;font-size:14.5px}
  /* two-lane flow diagram */
  .flow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .flow .lane{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .flow .lane.alt{border-color:#bcd7d2;background:#f3f8f6}
  .flow .lane-h{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:8px}
  .flow .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .flow .steps span{background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12.5px}
  .flow .steps span+span{margin-left:12px;position:relative}
  .flow .steps span+span:before{content:"→";position:absolute;left:-15px;color:var(--muted)}
  .flow .lane-n{font-size:12.5px;color:var(--ink2);margin-top:8px}
  /* value-chain strip */
  .chain{display:flex;gap:0;margin:14px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .chain .node{flex:1;background:var(--card);padding:10px 12px;border-right:1px solid var(--line);font-size:12.5px;position:relative}
  .chain .node:last-child{border-right:0}
  .chain .node b{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .chain .node span{display:block;font-weight:700}.chain .node em{display:block;font-style:normal;color:var(--ink2);font-size:11.5px;margin-top:3px}
  .chain .node.me{background:#f4eede}.chain .node.me b{color:var(--oxblood)}
  /* customer cards */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .cards .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px}
  .cards .card i{font-style:normal;font-weight:700;color:var(--ink2)}
  svg{max-width:100%;height:auto}figure svg{max-height:260px;display:block;margin:0 auto}
  figure{margin:14px 0}figcaption{font-size:12.5px;color:var(--ink2);margin-top:4px}
  footer{margin-top:48px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted)}
  @media(max-width:720px){.verdict,.facts{grid-template-columns:1fr 1fr}.pc,.flow,.cards{grid-template-columns:1fr}.chain{flex-direction:column}.chain .node{border-right:0;border-bottom:1px solid var(--line)}
    .score-row{grid-template-columns:120px 1fr 40px}.gauge-wrap{grid-template-columns:1fr}}
  /* print / PDF */
  @page{size:A4;margin:12mm}
  @media print{
    body{background:#fff}.wrap{max-width:100%;padding:0}
    .vcard,.gate,.caveat,.pc .col,.gauge-wrap,.tldr,.sc-note,.gap,.explain,.flow,.chain,.cards .card,figure{break-inside:avoid}
    tr,li{break-inside:avoid}h2,h3{break-after:avoid}
    .classif{border-color:#bbb}
    /* keep desktop layout on A4 (page is < the 720px mobile breakpoint) */
    .verdict{grid-template-columns:1.4fr 1fr 1.3fr}
    .facts{grid-template-columns:repeat(5,1fr)}
    .pc,.flow,.cards{grid-template-columns:1fr 1fr}
    .chain{flex-direction:row}
    .score-row{grid-template-columns:190px 1fr 46px}
    .gauge-wrap{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="classif">{{CLASSIF}}</span>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
  </header>

  {{SCORECARD}}

  {{BODY}}

  <footer>{{FOOTER}}</footer>
</div>
</body>
</html>
